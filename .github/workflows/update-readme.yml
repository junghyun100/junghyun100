name: Update README Stats

on:
  schedule:
    # 매일 06:17 KST (21:17 UTC) 실행
    - cron: '17 21 * * *'
  workflow_dispatch: # 수동 트리거 가능

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with latest stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pillow

      - name: Update contribution heatmap (github-readme-activity-graph)
        run: |
          python << 'EOF'
          import requests
          import re

          # 활동 그래프 이미지 URL 생성 (자동 업데이트됨)
          # github-readme-activity-graph.vercel.app은 요청 시 실시간 생성
          # 별도 다운로드 불필요 - README의 <img> src가 동적임
          print("Activity graph auto-updates via external service")
          EOF

      - name: Update blog post list
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://junghyun100.github.io/rss.xml"
          max_post_count: 5
          comment_tag_name: "BLOG-POST-LIST"
        # 사용자 블로그 RSS가 없으면 실패하므로 continue-on-error
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update README stats [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi